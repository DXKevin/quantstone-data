[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantstone-data"
version = "0.1.0"
description = "Financial dataset registry, collection, validation, and storage"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "pyarrow>=18,<24",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
wind-l2 = [
  "aget>=0.2",
  "chardet>=5.2",
  "cryptography>=41",
  "passlib>=1.7",
  "pillow>=10.1",
  "requests>=2",
  "requests-toolbelt>=1",
  "rich>=13.7",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quantstone_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=var/test-tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
