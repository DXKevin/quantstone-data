[package]
name = "quantstone-sdk"
version = "0.1.0"
edition = "2024"
description = "Rust client for the QuantStone Data HTTP API"
license = "MIT"

[dependencies]
arrow = "54"
parquet = "54"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
httpmock = "0.9"
tempfile = "3"
