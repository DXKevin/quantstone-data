[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantstone-sdk"
version = "0.1.0"
description = "Python client for the QuantStone Data HTTP API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pyarrow>=18,<24",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quantstone_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
